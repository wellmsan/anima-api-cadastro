name: CI/CD Pipeline - Spring Boot API

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configurar JDK 17 (compatível com o projeto)
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Mostrar versão do Java
        run: java -version

      - name: Rodar testes (Gradle)
        run: ./gradlew clean test --no-daemon --info --stacktrace
        # Se preferir falhar cedo em caso de teste com falha, mantenha essa task.
        # A saída de testes aparecerá nos logs do job.

      - name: Build do artefato (sem testes, já rodados acima)
        run: ./gradlew assemble --no-daemon --info
        # use 'assemble' para produzir jars sem rodar testes novamente.

      - name: Listar artefatos build
        run: ls -lh build/libs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Deploy no Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
