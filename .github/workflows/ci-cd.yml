name: CI/CD Pipeline - Spring Boot API

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configurar JDK 17 (compatível com o projeto)
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Mostrar versão do Java
        run: java -version

      - name: Rodar testes unitários
        run: ./gradlew clean test --no-daemon --info --stacktrace

      - name: Rodar BDD (Cucumber) — task cucumber
        run: ./gradlew cucumber --no-daemon --info --stacktrace

      - name: Build do artefato (assemble)
        run: ./gradlew assemble --no-daemon --info

      - name: Listar artefatos build
        run: ls -lh build/libs || true

      - name: Upload relatórios JUnit (XML) como artifact
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: build/test-results/test

      - name: Upload relatório HTML do Cucumber
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: build/reports/cucumber/report.html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Deploy no Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
